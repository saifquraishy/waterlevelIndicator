<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaSense API</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      background: linear-gradient(165deg, #dceef2, #e8f2f4);
      color: #12252e;
    }
    main {
      max-width: 32rem;
      padding: 2rem;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; }
    p { color: #5a7380; line-height: 1.5; }
    code {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
      background: rgba(18, 37, 46, 0.06);
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>AquaSense API</h1>
    <p>
      The dashboard now lives in the separate React app under <code>frontend/</code>.
      This host serves the water-level API backed by Neon PostgreSQL.
    </p>
    <code>GET /api/waterlevel/latest</code>
  </main>
</body>
</html>
